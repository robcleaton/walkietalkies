-224 -545 -566 -520 -543 40 17 424 250 887 638 1268 118 115 126 120 146 100z"/>
  <path id="a-line" pathLength="1" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" d="M157,600 L157,565 C160,420 230,230 330,130 C380,80 450,60 500,130 C525,165 545,210 545,270 C548,340 540,380 535,420 C520,560 470,665 395,680 C350,690 310,650 318,560 C335,420 440,305 515,220 C560,200 615,205 685,170"/>
  <!-- the late zone: the flick, and the diagonal below the crossing.
       Cut edges curve on from the letter's own edges; corners sit on
       its inside corners. Grown 2px here so the two halves overlap. -->
  <mask id="a-late-zone" maskUnits="userSpaceOnUse" x="-200" y="-200" width="1200" height="1200">
    <g fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round">
      <path d="M558.3,143.8 C582.9,192.8 595.1,229.0 593.2,283.8 L640,300 L800,320 L800,40 L600,60 Z"/>
      <path d="M420,175 L475.8,216.7 C475.6,273.0 486.7,307.9 491.1,364.1 L400,520 L250,520 L345,330 Z"/>
    </g>
  </mask>
  <mask id="a-early" maskUnits="userSpaceOnUse" x="0" y="0" width="393" height="511">
    <g transform="scale(0.6386) translate(-92.6,0)">
      <circle class="dot" cx="157" cy="565" r="50" fill="#fff"/>
      <use class="line" href="#a-line"/>
      <!-- hide the late zone -->
      <g fill="#000">
        <path d="M558.3,143.8 C582.9,192.8 595.1,229.0 593.2,283.8 L640,300 L800,320 L800,40 L600,60 Z"/>
        <path d="M420,175 L475.8,216.7 C475.6,273.0 486.7,307.9 491.1,364.1 L400,520 L250,520 L345,330 Z"/>
      </g>
    </g>
  </mask>
  <mask id="a-late" maskUnits="userSpaceOnUse" x="0" y="0" width="393" height="511">
    <g transform="scale(0.6386) translate(-92.6,0)">
      <g mask="url(#a-late-zone)"><use class="line late" href="#a-line"/></g>
    </g>
  </mask>
</defs>
<use href="#a-shape" mask="url(#a-early)"/>
<use href="#a-shape" mask="url(#a-late)"/>
<use class="final" href="#a-shape"/>
</svg>
